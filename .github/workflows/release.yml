name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # requerido para provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify clean install (React 19)
        run: node scripts/verify-clean-install.mjs
      - name: Verify clean install (React 18)
        run: node scripts/verify-clean-install.mjs
        env:
          REACT_VERSION: "18"
      - name: Verify release type matches version
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) HAS_SUFFIX=true ;;
            *) HAS_SUFFIX=false ;;
          esac
          if [ "$HAS_SUFFIX" != "$IS_PRERELEASE" ]; then
            echo "::error::package.json version $VERSION (pre-release suffix: $HAS_SUFFIX) does not match the GitHub Release prerelease flag ($IS_PRERELEASE)"
            exit 1
          fi
      - name: Publish to npm
        run: pnpm publish --access public --provenance --no-git-checks --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
