name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # requerido para provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify clean install (React 19)
        run: node scripts/verify-clean-install.mjs
      - name: Verify clean install (React 18)
        run: node scripts/verify-clean-install.mjs
        env:
          REACT_VERSION: "18"
      - name: Publish to npm
        run: pnpm publish --access public --provenance --no-git-checks --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
