version: 1
project:
  name: teams4soft-ui
  type: react-vite
content:
  language: es
git:
  host: github
  branchConvention: conventional
  branchPrefixes:
    - feat
    - fix
    - refactor
    - chore
    - docs
    - ci
    - perf
    - test
    - build
    - style
    - revert
    - feature
    - bugfix
    - hotfix
    - release
  baseBranches:
    - main
    - master
    - dev
    - develop
    - desarrollo
pullRequest:
  target: main
  template: .github/PULL_REQUEST_TEMPLATE.md
  rules: .tija/rules/pull-request.md
  title:
    convention: conventional-commits
    requireScope: true
    maxLength: 100
  requiredSections:
    - Resumen
    - Objetivo
    - Cambios realizados
    - Pruebas
  minSectionLength: 10
  invalidValues:
    - n/a
    - na
    - no aplica
    - pendiente
    - todo
    - por definir
    - '...'
    - '-'
  autoAssign: true
quality:
  tests:
    provider: vitest
agents:
  default: claude
  tasks:
    architecture:
      tier: deep
    comments:
      tier: fast
    pullRequest:
      tier: fast
    review:
      tier: balanced
skills:
  antislop-code:
    path: .tija/skills/antislop-code/SKILL.md
  antislop-copywriting:
    path: .tija/skills/antislop-copywriting/SKILL.md
  generar-informe-pdf:
    path: .tija/skills/generar-informe-pdf/SKILL.md
  generar-reporte-actividades:
    path: .tija/skills/generar-reporte-actividades/SKILL.md
  thermo-quality:
    path: .tija/skills/thermo-quality/SKILL.md
  thermo-review:
    path: .tija/skills/thermo-review/SKILL.md
comments:
  include:
    - src/**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}
  exclude:
    - '**/*.min.js'
    - dist/**
    - build/**
    - '**/*.d.ts'
    - node_modules/**
